name: Test PS4 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Build PS4 sample
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo
          docker pull openorbisofficial/toolchain:v0.5.1
          docker run --rm \
            -v "$GITHUB_WORKSPACE/oo:/workspace" \
            -w /workspace/samples/hello_world \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc 'make && PkgTool.Core pkg_build pkg/pkg.gp4 .'
          mkdir -p out
          find oo -name "*.pkg" -exec cp {} out/ \;

      - name: Save PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-test-pkg
          path: out/*.pkg
